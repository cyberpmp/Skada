name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test release tooling
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run tests
        run: python tests/run_tests.py

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging Skada $version"

      - name: Verify release version
        run: |
          toc="$(grep -Po '(?<=^## Version: ).*' Skada.toc)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag v$tag is not a semantic version."
            exit 1
          fi
          if [ "$toc" != "$tag" ]; then
            echo "::error::Tag is v$tag but Skada.toc declares $toc. Update ## Version: in Skada.toc, commit, and re-tag."
            exit 1
          fi

      - name: Build release notes from changelog
        run: |
          python tools/extract_release_notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --output release-notes.md
          {
            echo "## Release notes"
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package addon
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "pkg/Skada"
          cp Skada.toc pkg/Skada/
          cp -r commands combat core data media modes options threat tracking ui pkg/Skada/
          {
            cat LICENSE
            printf "\n\n"
            cat THIRD_PARTY_NOTICES.md
          } > pkg/Skada/LICENSES.txt
          sed -i "s/^## Version: .*/## Version: $VERSION/" "pkg/Skada/Skada.toc"
          cd pkg
          zip -r "../Skada-$VERSION.zip" Skada

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "Skada v${{ steps.version.outputs.version }}"
          files: Skada-*.zip
          body_path: release-notes.md
          append_body: false
          make_latest: true
          overwrite_files: true
